[package]
name = "easygre"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency Rust user-space GRE tunnel daemon with bidirectional keepalive and TCP MSS clamping"
license = "MIT"
repository = "https://github.com/aurorax-neo/EasyGRE"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
